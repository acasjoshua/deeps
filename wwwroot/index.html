<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEEPS - Speedrun Practice Tracker</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
</head>
<body class="bg-deeps-page text-deeps-text">
    <div id="app" class="p-6 text-deeps-muted">Loading...</div>
    <div id="blazor-error-ui" class="hidden fixed bottom-0 inset-x-0 bg-deeps-danger-surface p-3 text-sm">
        An unhandled error has occurred.
        <a href="" class="underline">Reload</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        window.deepsSetTheme = theme => {
            document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
        };

        const deepsOverlayPublishers = new Map();
        const deepsOverlaySubscriptions = new Map();
        let deepsOverlaySubscriptionId = 0;

        window.deepsOverlaySupported = () => "BroadcastChannel" in window;
        window.deepsOverlayPublish = (categoryId, snapshot) => {
            if (!window.deepsOverlaySupported()) return;
            let channel = deepsOverlayPublishers.get(categoryId);
            if (!channel) {
                channel = new BroadcastChannel(`deeps-overlay-${categoryId}`);
                deepsOverlayPublishers.set(categoryId, channel);
            }
            channel.postMessage(snapshot);
        };
        window.deepsOverlayClosePublisher = categoryId => {
            const channel = deepsOverlayPublishers.get(categoryId);
            if (!channel) return;
            channel.close();
            deepsOverlayPublishers.delete(categoryId);
        };
        window.deepsOverlaySubscribe = (categoryId, dotNetReference) => {
            const channel = new BroadcastChannel(`deeps-overlay-${categoryId}`);
            const listener = event => dotNetReference.invokeMethodAsync("ReceiveOverlaySnapshot", event.data);
            channel.addEventListener("message", listener);
            const id = ++deepsOverlaySubscriptionId;
            deepsOverlaySubscriptions.set(id, { channel, listener });
            return id;
        };
        window.deepsOverlayUnsubscribe = id => {
            const subscription = deepsOverlaySubscriptions.get(id);
            if (!subscription) return;
            subscription.channel.removeEventListener("message", subscription.listener);
            subscription.channel.close();
            deepsOverlaySubscriptions.delete(id);
        };
        window.deepsSetOverlayMode = enabled => {
            document.body.classList.toggle("deeps-overlay", enabled);
        };

        document.addEventListener("keydown", event => {
            if (event.key !== " " || !(event.target instanceof Element)) return;
            const target = event.target;
            if (!target.closest("[data-practice-hotkeys][data-practice-space-hotkey='true']") ||
                target.closest("a, button, input, select, textarea, label, [contenteditable='true']")) return;
            event.preventDefault();
        }, true);

        // Trigger a file download from a base64 string
        window.deepsDownload = function (filename, base64, mime) {
            const a   = document.createElement('a');
            a.href    = 'data:' + mime + ';base64,' + base64;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };

        // Read a file chosen via <input type="file"> and return its text content
        window.deepsReadFile = function (inputId) {
            return new Promise((resolve, reject) => {
                const input = document.getElementById(inputId);
                if (!input || !input.files || input.files.length === 0) {
                    resolve(null);
                    return;
                }
                const reader = new FileReader();
                reader.onload  = e => resolve(e.target.result);
                reader.onerror = () => reject('read error');
                reader.readAsText(input.files[0]);
            });
        };

        // Gamepad polling — returns all currently pressed button indices for a gamepad index
        window.deepsGamepadButtons = function (gamepadIndex) {
            const gp = navigator.getGamepads ? navigator.getGamepads()[gamepadIndex] : null;
            if (!gp) return [];
            return gp.buttons.map((b, i) => ({ index: i, pressed: b.pressed, value: b.value }))
                              .filter(b => b.pressed)
                              .map(b => b.index);
        };
    </script>
</body>
</html>
